name: Pull request validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_NAME: customer-operations-platform
      LOG_LEVEL: info
      DATABASE_URL: postgresql://customer_ops:local_development_only@127.0.0.1:5432/customer_ops
      WEB_ORIGIN: http://localhost:3000
      AUTH_SESSION_TTL_SECONDS: 604800
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_PREFIX: customer-ops-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - name: Start development dependencies
        run: docker compose up -d
      - name: Verify development dependency health
        shell: bash
        run: |
          set -euo pipefail
          for service in postgres redis minio; do
            container_id="$(docker compose ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "No container found for $service"
              docker compose ps
              exit 1
            fi

            status="starting"
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "$service became unhealthy"
                docker compose logs "$service"
                exit 1
              fi
              sleep 2
            done

            if [ "$status" != "healthy" ]; then
              echo "$service did not become healthy (last status: $status)"
              docker compose logs "$service"
              exit 1
            fi
          done
      - name: Validate database migrations
        run: |
          pnpm db:migrate:status
          pnpm db:migrate:latest
          pnpm db:migrate:status
          pnpm db:migrate:down
          pnpm db:migrate:latest
      - run: pnpm test:database
      - run: pnpm test:queue
      - run: pnpm test:auth
      - run: pnpm test:tenancy
      - run: pnpm test:access
      - run: pnpm test:teams
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Stop development dependencies
        if: always()
        run: docker compose down -v
